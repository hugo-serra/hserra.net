<?xml version="1.0" encoding="UTF-8"?>
<!--
  Source for public/og.png — the site-wide OpenGraph / Twitter card (1200×630).
  Brand tokens from @hs/design: bg #ffffff, ink #1a2224, muted #636f73,
  primary (teal) #007a96. Hierarchy is weight contrast only (600 / 400).
  Regenerate the PNG with:
    rsvg-convert -w 1200 -h 630 assets/og.svg -o public/og.png
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- brand label, teal — the same primary signal as the nav brand -->
  <text x="100" y="140"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="34" font-weight="600" letter-spacing="0.5" fill="#007a96">hserra.dev</text>

  <!-- name -->
  <text x="98" y="350"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="118" font-weight="600" fill="#1a2224">Hugo Serra</text>

  <!-- tagline, muted -->
  <text x="100" y="420"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="42" font-weight="400" fill="#636f73">Senior full stack engineer &amp; team leader</text>

  <!-- restrained teal accent bar along the bottom edge -->
  <rect x="0" y="614" width="1200" height="16" fill="#007a96"/>
</svg>
